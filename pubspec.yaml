name: adsb_support_desk
description: Parken Support Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase ───
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  # firebase_storage: ^12.3.2

  cloud_functions: ^5.1.3

  # ─── Utilities ───
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1

  # ─── File & image picking ───
  image_picker: ^1.1.2
  file_picker: ^8.1.6

  open_filex: ^4.5.0
  flutter_pdfview: ^1.4.5

  firebase_storage: ^12.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/